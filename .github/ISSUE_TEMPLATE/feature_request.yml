name: Feature request
description: Propose a small, consent-preserving improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: New data permission required?
      options: [No, Camera, Microphone, Motion, Location, Health, Calendar, Messaging, Other]
    validations:
      required: true
  - type: textarea
    id: consent
    attributes:
      label: Consent and failure behavior
      description: How can the user see, decline, pause, and recover from this behavior?
    validations:
      required: true
