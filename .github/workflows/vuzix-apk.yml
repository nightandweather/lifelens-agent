name: Build signed Vuzix APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-vuzix/**"
      - ".github/workflows/vuzix-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-vuzix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VUZIX_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/lifelens-vuzix.jks
      - name: Build signed release APK
        env:
          VUZIX_KEYSTORE_PATH: ../signing/lifelens-vuzix.jks
          VUZIX_KEYSTORE_PASSWORD: ${{ secrets.VUZIX_KEYSTORE_PASSWORD }}
          VUZIX_KEY_ALIAS: ${{ secrets.VUZIX_KEY_ALIAS }}
          VUZIX_KEY_PASSWORD: ${{ secrets.VUZIX_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lifelens-vuzix-release
          path: android-vuzix/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
